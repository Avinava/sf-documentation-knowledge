<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>

    <!-- Hub Node Gradient -->
    <linearGradient id="hub" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A1E0" />
      <stop offset="100%" stop-color="#005B9F" />
    </linearGradient>

    <!-- Doc Node Gradient -->
    <linearGradient id="doc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- MCP Node Gradient -->
    <linearGradient id="mcp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>

    <!-- Subtle Glow for lines -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Drop Shadow for Nodes -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="240" rx="16" fill="url(#bg)" />
  
  <!-- Traffic Lights (macOS buttons) -->
  <g transform="translate(24, 24)">
    <!-- Red -->
    <circle cx="0" cy="0" r="7" fill="#EF4444" />
    <!-- Yellow -->
    <circle cx="22" cy="0" r="7" fill="#F59E0B" />
    <!-- Green -->
    <circle cx="44" cy="0" r="7" fill="#10B981" />
  </g>

  <!-- Subtle Grid Background -->
  <g stroke="#ffffff" stroke-width="1" stroke-opacity="0.03">
    <!-- Vertical lines -->
    <line x1="100" y1="0" x2="100" y2="240" />
    <line x1="200" y1="0" x2="200" y2="240" />
    <line x1="300" y1="0" x2="300" y2="240" />
    <line x1="400" y1="0" x2="400" y2="240" />
    <line x1="500" y1="0" x2="500" y2="240" />
    <line x1="600" y1="0" x2="600" y2="240" />
    <line x1="700" y1="0" x2="700" y2="240" />
    <!-- Horizontal lines -->
    <line x1="0" y1="60" x2="800" y2="60" />
    <line x1="0" y1="120" x2="800" y2="120" />
    <line x1="0" y1="180" x2="800" y2="180" />
  </g>

  <!-- Left Icon Representation (Knowledge Graph / MCP) -->
  <g transform="translate(130, 120)">
    
    <!-- Connection Lines -->
    <g stroke="#38BDF8" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="4 4" filter="url(#glow)">
      <!-- Left side doc nodes to hub -->
      <line x1="-80" y1="-50" x2="0" y2="0" />
      <line x1="-90" y1="20" x2="0" y2="0" />
      <line x1="-50" y1="60" x2="0" y2="0" />
      
      <!-- Hub to MCP nodes -->
      <line x1="0" y1="0" x2="70" y2="-40" stroke="#F472B6" />
      <line x1="0" y1="0" x2="80" y2="30" stroke="#F472B6" />
    </g>

    <!-- Document/Raw Nodes -->
    <circle cx="-80" cy="-50" r="14" fill="url(#doc)" filter="url(#shadow)" />
    <circle cx="-90" cy="20" r="10" fill="url(#doc)" filter="url(#shadow)" />
    <circle cx="-50" cy="60" r="16" fill="url(#doc)" filter="url(#shadow)" />
    
    <!-- Internal dots for documents -->
    <circle cx="-80" cy="-50" r="4" fill="#ffffff" opacity="0.8"/>
    <circle cx="-90" cy="20" r="3" fill="#ffffff" opacity="0.8"/>
    <circle cx="-50" cy="60" r="5" fill="#ffffff" opacity="0.8"/>

    <!-- MCP Serving Nodes -->
    <circle cx="70" cy="-40" r="16" fill="url(#mcp)" filter="url(#shadow)" />
    <circle cx="80" cy="30" r="12" fill="url(#mcp)" filter="url(#shadow)" />
    
    <!-- Code brackets inside MCP nodes -->
    <text x="70" y="-39" font-family="monospace" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">&lt;&gt;</text>
    <text x="80" y="31" font-family="monospace" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">{}</text>

    <!-- Central Hub Node (Salesforce Knowledge) -->
    <!-- Adding a subtle cloud-like grouping behind central node -->
    <path d="M-25,5 C-30,0 -20,-15 -5,-15 C0,-25 10,-25 20,-15 C30,-15 35,0 25,10 C20,20 -5,25 -15,15 Z" fill="#0EA5E9" opacity="0.3" filter="url(#glow)"/>
    
    <circle cx="0" cy="0" r="28" fill="url(#hub)" filter="url(#shadow)" />
    <!-- SF Cloud outline inside hub -->
    <path d="M -11 6 C -15 6 -15 0 -11 0 C -11 -6 -2 -8 1 -3 C 5 -7 13 -4 12 1 C 18 1 18 7 11 9 L -11 9 Z" fill="#ffffff" />
  </g>

  <!-- Title and Subtitle Text -->
  <g transform="translate(270, 120)">
    <text x="0" y="-12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#ffffff" dominant-baseline="middle" letter-spacing="-0.5">
      sf-documentation<tspan fill="#38BDF8">-knowledge</tspan>
    </text>
    
    <text x="5" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#94A3B8" dominant-baseline="middle" letter-spacing="1">
      CONTEXT ENGINEERING &amp; MCP SERVER
    </text>
    
    <!-- Highlight dot -->
    <circle cx="-10" cy="38" r="4" fill="#F472B6" />
  </g>

</svg>
