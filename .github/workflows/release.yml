name: Release & Publish

# Trigger on version tags (push v1.0.0, v1.2.3, etc.)
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # For creating GitHub releases
      id-token: write  # For npm provenance

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Full history for changelog

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Verify package version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "${{ steps.version.outputs.VERSION }}" ]; then
            echo "❌ package.json version ($PKG_VERSION) doesn't match tag (v${{ steps.version.outputs.VERSION }})"
            exit 1
          fi
          echo "✅ Version verified: $PKG_VERSION"

      - name: Verify MCP server starts
        run: |
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1.0.0"}}}' | timeout 15 node dist/mcp/server.js 2>/dev/null | grep -q '"serverInfo"'
          echo "✅ MCP server verified"

      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        run: |
          cat <<'BODY' > /tmp/release-body.md
          ## Install
          ```bash
          npm install @sfdxy/sf-documentation-knowledge@${{ steps.version.outputs.VERSION }}
          ```

          ## MCP Server Setup (Claude Desktop)
          Add to `~/Library/Application Support/Claude/claude_desktop_config.json`:
          ```json
          {
            "mcpServers": {
              "sf-docs": {
                "command": "npx",
                "args": ["-y", "-p", "@sfdxy/sf-documentation-knowledge@${{ steps.version.outputs.VERSION }}", "sf-docs-mcp"]
              }
            }
          }
          ```

          > **Note:** The `-p` flag installs the package and `sf-docs-mcp` explicitly invokes the MCP server binary (not the data pipeline CLI).

          ## Available MCP Tools (9)
          | Tool | Purpose |
          |---|---|
          | `sf_search` | Search across 121 SF documentation domains |
          | `sf_read_topic` | Read a specific documentation topic |
          | `sf_graph_query` | Navigate the knowledge graph |
          | `sf_list_domains` | List all available domains |
          | `sf_apex_lookup` | Look up Apex classes and methods |
          | `sf_code_examples` | Find working code snippets |
          | `sf_object_reference` | Look up Salesforce objects and fields |
          | `sf_explain_error` | Decode error messages with resolution steps |
          | `sf_limits` | Governor limits lookup (15 categories) |

          See [README.md](https://github.com/Avinava/sf-documentation-knowledge#readme) for full documentation.
          BODY
          gh release create "v${{ steps.version.outputs.VERSION }}" \
            --title "v${{ steps.version.outputs.VERSION }}" \
            --notes-file /tmp/release-body.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

